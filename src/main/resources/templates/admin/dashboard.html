<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head th:replace="~{fragments/head :: head}"></head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/sidebar :: sidebarDesktop}"></aside>
    <div th:replace="~{fragments/sidebar :: sidebarMobile}"></div>

    <div class="admin-main">
        <header th:replace="~{fragments/topbar :: topbar}"></header>

        <main class="admin-content p-3 p-lg-4">
            <div th:replace="~{fragments/flash-messages :: flashMessages}"></div>

            <div id="summary-cards" th:fragment="summaryCards"
                 class="row g-3 mb-4"
                 th:attr="hx-get=@{/admin/dashboard/summary-cards}"
                 hx-trigger="every 30s"
                 hx-swap="outerHTML">

                <div class="col-6 col-lg-3">
                    <div class="card admin-kpi-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="admin-kpi-icon bg-primary-subtle text-primary">
                                <i class="bi bi-flower3"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Arrangements</div>
                                <div class="fs-4 fw-semibold" th:text="${summary.totalArrangements}">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="card admin-kpi-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="admin-kpi-icon bg-success-subtle text-success">
                                <i class="bi bi-check-circle"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Available now</div>
                                <div class="fs-4 fw-semibold" th:text="${summary.availableArrangements}">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="card admin-kpi-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="admin-kpi-icon bg-info-subtle text-info">
                                <i class="bi bi-diagram-3"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Categories</div>
                                <div class="fs-4 fw-semibold" th:text="${summary.totalCategories}">0</div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-6 col-lg-3">
                    <div class="card admin-kpi-card h-100">
                        <div class="card-body d-flex align-items-center gap-3">
                            <div class="admin-kpi-icon bg-warning-subtle text-warning">
                                <i class="bi bi-question-circle"></i>
                            </div>
                            <div>
                                <div class="text-muted small">Active FAQs</div>
                                <div class="fs-4 fw-semibold">
                                    <span th:text="${summary.activeFaqs}">0</span>
                                    <span class="text-muted fs-6">/ <span th:text="${summary.totalFaqs}">0</span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row g-3">
                <div class="col-12 col-lg-6">
                    <div class="card h-100">
                        <div class="card-header bg-white fw-semibold">Quick actions</div>
                        <div class="card-body d-flex flex-wrap gap-2">
                            <a th:href="@{/admin/arrangements/new}" class="btn btn-primary btn-sm">
                                <i class="bi bi-plus-lg"></i> New arrangement
                            </a>
                            <a th:href="@{/admin/categories/new}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-plus-lg"></i> New category
                            </a>
                            <a th:href="@{/admin/faqs/new}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-plus-lg"></i> New FAQ
                            </a>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-lg-6">
                    <div class="card h-100">
                        <div class="card-header bg-white fw-semibold">System</div>
                        <div class="card-body">
                            <p class="text-muted small mb-0">
                                Signed in as <strong th:text="${username}">Admin</strong>.
                                Health, metrics, and Swagger are behind the ADMIN role too — see
                                <code>/actuator/health</code>.
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js"
        integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V"
        crossorigin="anonymous"></script>
</body>
</html>
