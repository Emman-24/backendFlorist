# =============================================================================
# application-local.properties  —  local development only
# Activate with: spring.profiles.active=local
# =============================================================================

spring.datasource.url=jdbc:mysql://localhost:3306/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

app.security.environment=local
app.cors.allowed-origins=http://localhost:4200,http://localhost:3000

security.jwt.secret-key=local-dev-key-min-32-bytes-required!!

logging.level.root=INFO
logging.level.com.floristeriaakasia=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.org.springframework.security=DEBUG
